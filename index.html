      rel="stylesheet"
    />
    <style>
      /* small loader shown instantly (before any script runs); src/App.jsx fades it out once the page is ready */
      #boot { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        background: radial-gradient(ellipse at 50% 40%, #d9b98c 0%, #b48c5e 70%); transition: opacity 0.5s ease, visibility 0.5s; }
      #boot.is-out { opacity: 0; visibility: hidden; }
      #boot svg { width: 34px; height: auto; overflow: visible; animation: boot-bob 2.4s ease-in-out infinite; filter: drop-shadow(0 6px 8px rgba(70, 35, 12, 0.35)); }
      #boot .wine { animation: boot-fill 2.2s ease-in-out infinite alternate; }
      #boot p { margin: 0; color: #fff; font: 600 11px/1 Georgia, serif; letter-spacing: 0.34em; padding-left: 0.34em; text-transform: uppercase; text-shadow: 0 1px 6px rgba(70, 35, 12, 0.4); }
      @keyframes boot-fill { from { transform: translateY(150px); } to { transform: translateY(58px); } }
      @keyframes boot-bob { 50% { transform: translateY(-3px); } }
      @media (prefers-reduced-motion: reduce) { #boot svg, #boot .wine { animation: none; } #boot .wine { transform: translateY(90px); } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Ачаалж байна">
      <svg viewBox="0 0 120 300" aria-hidden="true">
        <defs><clipPath id="bootclip"><path d="M50 8h20v6l-1.5 2v52c0 14 22 24 22 60v140a12 12 0 0 1-12 12H41.5a12 12 0 0 1-12-12V128c0-36 22-46 22-60V16l-1.5-2z" /></clipPath></defs>
        <g clip-path="url(#bootclip)"><rect class="wine" x="0" y="0" width="120" height="320" fill="#8a1f37" /></g>
        <path d="M50 8h20v6l-1.5 2v52c0 14 22 24 22 60v140a12 12 0 0 1-12 12H41.5a12 12 0 0 1-12-12V128c0-36 22-46 22-60V16l-1.5-2z" fill="rgba(255,255,255,.14)" stroke="#fff" stroke-width="5" stroke-linejoin="round" />
        <rect x="49" y="3" width="22" height="14" rx="2.5" fill="#6a1f2c" />
      </svg>
      <p>Steppe &amp; Vine</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
